name: Docker Image CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Only publish the image for commits that landed on the main branch, never for pull requests
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag envidtech/new-robotics-web:latest

      - name: Push to Docker Hub
        run: docker push envidtech/new-robotics-web:latest

  # Pull requests (including Dependabot, which has no access to secrets) - build only, no push
  build-only:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image (test only)
        run: docker build . --file Dockerfile --tag envidtech/new-robotics-web:test